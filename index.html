<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Edit Marker">
<meta name="theme-color" content="#000000">
<title>Edit Marker</title>
<style>
  :root { color-scheme: dark; --blue:#4da3ff; --red:#ff3b30; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff;
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  button { font-family: inherit; cursor: pointer; }

  /* Player: three equal thirds */
  #app {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: grid; grid-template-rows: 1fr 1fr 1fr;
  }
  .top { display: flex; flex-direction: column; padding: 4px 8px; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 6px; }
  .iconbtn { background: none; border: none; color: var(--blue); font-size: 30px; line-height: 1; padding: 8px 12px; }
  .fname { flex: 1; text-align: center; color: #999; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { background: rgba(255,59,48,.85); border-radius: 999px; padding: 4px 11px; font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .transport { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 0; }
  #playBtn { width: 96px; height: 96px; border-radius: 50%; border: none; background: var(--blue); display: flex; align-items: center; justify-content: center; }
  #playBtn svg { width: 42px; height: 42px; fill: #000; }
  #playBtn:active { opacity: .8; }
  .time { color: #aaa; font-size: 20px; font-variant-numeric: tabular-nums; }

  .markwrap { padding: 12px; min-height: 0; }
  #markBtn {
    width: 100%; height: 100%; border: none; border-radius: 28px;
    background: rgba(255,59,48,.72); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    touch-action: none; transition: transform .08s, background .08s;
  }
  #markBtn.down { background: var(--red); transform: scale(.97); }
  #markBtn .big { font-size: 56px; font-weight: 800; letter-spacing: 1px; }
  #markBtn .last { font-size: 17px; opacity: .85; font-variant-numeric: tabular-nums; min-height: 1.3em; }

  .wavebox { position: relative; background: #141414; touch-action: none; min-height: 0; }
  #wave { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .waveinfo { position: absolute; top: 6px; left: 8px; right: 8px; display: flex; justify-content: space-between; font-size: 12px; pointer-events: none; font-variant-numeric: tabular-nums; }
  .waveinfo .dim { color: #888; }
  #waveStatus { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font-size: 13px; pointer-events: none; text-align: center; padding: 24px; }

  /* Menu */
  #menu {
    position: fixed; inset: 0; background: #000; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 32px);
    display: none; z-index: 10;
  }
  #menu.open { display: block; }
  #menu h1 { font-size: 32px; margin: 12px 4px 18px; }
  .label { font-size: 13px; text-transform: uppercase; color: #8e8e93; margin: 0 16px 6px; }
  .card { background: #1c1c1e; border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .foot { font-size: 13px; color: #8e8e93; margin: 0 16px 22px; line-height: 1.4; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 16px; border-top: 1px solid #2c2c2e; font-size: 17px; min-height: 48px;
  }
  .card > .row:first-child { border-top: none; }
  button.row { width: 100%; background: none; border-left: none; border-right: none; border-bottom: none; color: var(--blue); text-align: left; }
  .card > button.row:first-child { border-top: none; }
  button.row.danger { color: var(--red); }
  button.row:active { background: #2c2c2e; }
  .strong { font-weight: 600; color: #fff; word-break: break-word; }
  .mono { font-variant-numeric: tabular-nums; color: #8e8e93; }
  .markrow { cursor: pointer; }
  .markrow:active { background: #2c2c2e; }
  .del { background: none; border: none; color: #8e8e93; font-size: 20px; padding: 4px 8px; }
  .stepper { display: flex; gap: 6px; }
  .stepper button { width: 44px; height: 34px; border-radius: 8px; border: none; background: #3a3a3c; color: #fff; font-size: 20px; }
  .empty { color: #8e8e93; }
</style>
</head>
<body>

<div id="app">
  <section class="top">
    <div class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="fname" id="fname">No file</div>
      <div class="badge" id="badge">0</div>
    </div>
    <div class="transport">
      <button id="playBtn" aria-label="Play or pause"></button>
      <div class="time" id="time">0:00 / 0:00</div>
    </div>
  </section>

  <section class="markwrap">
    <button id="markBtn" aria-label="Mark">
      <span class="big">MARK</span>
      <span class="last" id="lastMark"></span>
    </button>
  </section>

  <section class="wavebox" id="waveBox">
    <canvas id="wave"></canvas>
    <div class="waveinfo"><span id="waveTime">0:00.000</span><span class="dim" id="waveZoom">30s view</span></div>
    <div id="waveStatus">Open a file from the menu</div>
  </section>
</div>

<div id="menu" class="open"></div>

<audio id="audio" preload="auto"></audio>
<input type="file" id="fileInput" accept="audio/*,.wav,.mp3,.m4a,.aif,.aiff" hidden>

<script>
"use strict";

// ---------- Setup ----------
const $ = id => document.getElementById(id);
const audio = $("audio");
const ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';

let file = null, fileKey = null;
let marks = [];          // seconds, sorted
let lastMark = null;
let peaks = null;        // Uint8Array, 0–255
let windowSec = 30;      // seconds visible across the waveform
let scrub = null;        // active drag-to-scrub
let pinch = null;        // active pinch-zoom
let dirty = true;        // waveform needs redraw
let waveToken = 0;
let lastSavedPos = 0;
let offset = parseFloat(load("em.offset") || "0") || 0;   // reaction offset, seconds

function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const duration = () => (isFinite(audio.duration) ? audio.duration : 0);

function fmt(t, ms) {
  t = Math.max(0, t || 0);
  const total = Math.floor(t), h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  let str = h > 0 ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
  if (ms) str += "." + String(Math.floor((t - total) * 1000)).padStart(3, "0");
  return str;
}

// ---------- File open ----------
$("fileInput").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (f) openFile(f);
});

async function openFile(f) {
  if (audio.src) { savePos(); audio.pause(); URL.revokeObjectURL(audio.src); }
  file = f;
  fileKey = `${f.name}|${f.size}`;
  try { marks = JSON.parse(load("em.marks." + fileKey) || "[]"); } catch (e) { marks = []; }
  lastMark = null; peaks = null;
  $("fname").textContent = f.name.replace(/\.[^.]+$/, "");
  setStatus("Loading…");

  audio.src = URL.createObjectURL(f);
  try {
    await new Promise((res, rej) => {
      audio.onloadedmetadata = () => res();
      audio.onerror = () => rej(new Error("Safari can't play this file type."));
    });
  } catch (err) {
    alert(err.message); file = null; renderMenu(); return;
  }

  const pos = parseFloat(load("em.pos." + fileKey) || "0");
  if (pos > 0 && pos < duration()) audio.currentTime = pos;
  lastSavedPos = audio.currentTime;

  closeMenu();
  updateUI();
  updateMediaSession();
  buildWaveform(f);
}

// ---------- Transport ----------
function play() {
  if (!file) return;
  audio.play().catch(err => console.warn(err));
}
function pause() { audio.pause(); }
function togglePlay() { audio.paused ? play() : pause(); }
function seek(t) {
  if (!file) return;
  audio.currentTime = clamp(t, 0, duration());
  savePos(); dirty = true; updateUI(); updatePosition();
}
function skip(s) { seek(audio.currentTime + s); }

function savePos() {
  if (!fileKey) return;
  store("em.pos." + fileKey, String(audio.currentTime));
  lastSavedPos = audio.currentTime;
}

audio.addEventListener("play", () => { updateUI(); updatePosition(); });
audio.addEventListener("pause", () => { savePos(); updateUI(); updatePosition(); });
audio.addEventListener("ended", () => { updateUI(); updatePosition(); });
audio.addEventListener("timeupdate", () => { if (Math.abs(audio.currentTime - lastSavedPos) > 5) savePos(); });
document.addEventListener("visibilitychange", savePos);

$("playBtn").addEventListener("click", togglePlay);

// ---------- Marks ----------
function mark() {
  if (!file) return;
  const t = Math.max(0, audio.currentTime - offset);
  marks.push(t);
  marks.sort((a, b) => a - b);
  lastMark = t;
  saveMarks();
  flashMark();
}
function saveMarks() {
  if (fileKey) store("em.marks." + fileKey, JSON.stringify(marks));
  dirty = true; updateUI(); updateMediaSession(); renderMenu();
}
let flashTimer = null;
function flashMark() {
  const b = $("markBtn");
  b.classList.add("down");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { if (!markHeld) b.classList.remove("down"); }, 120);
}

// Mark on touch-down, not release, for tighter timing.
let markHeld = false;
$("markBtn").addEventListener("pointerdown", e => { e.preventDefault(); markHeld = true; mark(); });
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
  $("markBtn").addEventListener(ev, () => { markHeld = false; $("markBtn").classList.remove("down"); }));

// ---------- AirPods / lock screen ----------
//  1 press  -> Mark          ("play"/"pause" actions)
//  2 presses -> Play/pause   ("nexttrack")
//  3 presses -> Back 15 s    ("previoustrack")
if ("mediaSession" in navigator) {
  const set = (action, handler) => { try { navigator.mediaSession.setActionHandler(action, handler); } catch (e) {} };
  set("play", () => mark());
  set("pause", () => mark());
  set("nexttrack", () => togglePlay());
  set("previoustrack", () => skip(-15));
  set("seekto", d => seek(d.seekTime));
  set("seekbackward", null);   // off, so iOS shows/sends next & previous instead
  set("seekforward", null);
}
function updateMediaSession() {
  if (!("mediaSession" in navigator) || !file) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: file.name.replace(/\.[^.]+$/, ""),
      artist: `${marks.length} marks`,     // lets you confirm a press registered
      album: "Edit Marker"
    });
  } catch (e) {}
  updatePosition();
}
function updatePosition() {
  if (!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
    if (duration() > 0) navigator.mediaSession.setPositionState({
      duration: duration(), position: clamp(audio.currentTime, 0, duration()), playbackRate: 1
    });
  } catch (e) {}
}

// ---------- UI ----------
function updateUI() {
  $("playBtn").innerHTML = audio.paused ? ICON_PLAY : ICON_PAUSE;
  $("badge").textContent = marks.length;
  $("lastMark").textContent = lastMark != null ? "Last: " + fmt(lastMark, true) : "";
  updateTime();
}
function updateTime() {
  $("time").textContent = `${fmt(audio.currentTime)} / ${fmt(duration())}`;
}

// ---------- Waveform: build ----------
function setStatus(s) { $("waveStatus").textContent = s; $("waveStatus").style.display = s ? "flex" : "none"; }

async function buildWaveform(f) {
  const token = ++waveToken;
  const cacheKey = "em.peaks." + fileKey;
  const cached = load(cacheKey);
  if (cached) { peaks = b64ToU8(cached); setStatus(""); dirty = true; return; }

  setStatus("Building waveform… 0%");
  try {
    let p = await wavPeaks(f, token);
    if (p === undefined) p = await decodedPeaks(f, token);   // not a WAV
    if (token !== waveToken || !p) return;
    peaks = p;
    store(cacheKey, u8ToB64(p));
    setStatus(""); dirty = true;
  } catch (err) {
    if (token === waveToken) setStatus(`No waveform for this file (${err.message}). Marking and scrubbing still work.`);
  }
}

const tick = () => new Promise(r => setTimeout(r, 0));
const str4 = (dv, o) => String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
async function bytes(f, start, len) { return new DataView(await f.slice(start, start + len).arrayBuffer()); }

// Streams a WAV in small slices, so an hour-long file never sits in memory.
async function wavPeaks(f, token) {
  if (f.size < 44) return undefined;
  const head = await bytes(f, 0, 12);
  const riff = str4(head, 0);
  if ((riff !== "RIFF" && riff !== "RF64") || str4(head, 8) !== "WAVE") return undefined;

  let pos = 12, fmtInfo = null, dataStart = 0, dataLen = 0;
  while (pos + 8 <= f.size) {
    const h = await bytes(f, pos, 8);
    const id = str4(h, 0), size = h.getUint32(4, true);
    if (id === "fmt ") {
      const d = await bytes(f, pos + 8, Math.min(size, 40));
      let format = d.getUint16(0, true);
      if (format === 0xFFFE && size >= 26) format = d.getUint16(24, true);   // WAVE_FORMAT_EXTENSIBLE
      fmtInfo = { format, ch: d.getUint16(2, true), sr: d.getUint32(4, true), align: d.getUint16(12, true), bits: d.getUint16(14, true) };
    } else if (id === "data") {
      dataStart = pos + 8;
      dataLen = (riff === "RF64" || size === 0xFFFFFFFF || dataStart + size > f.size) ? f.size - dataStart : size;
      break;
    }
    pos += 8 + size + (size & 1);
  }
  if (!fmtInfo || !dataStart) throw new Error("unreadable WAV");
  const { format, ch, sr, align, bits } = fmtInfo;
  const ok = (format === 1 && (bits === 16 || bits === 24 || bits === 32)) || (format === 3 && bits === 32);
  if (!ok) throw new Error(`unsupported WAV format (${bits}-bit)`);

  const fpp = Math.max(1, Math.round(sr / 50));            // frames per peak -> 50 peaks/sec
  const totalFrames = Math.floor(dataLen / align);
  const out = new Uint8Array(Math.ceil(totalFrames / fpp));
  const scale = bits === 16 ? 1 / 32768 : format === 3 ? 1 : bits === 32 ? 1 / 2147483648 : 1 / 8388608;
  const chunkFrames = fpp * 512;
  let frame = 0, pi = 0;

  while (frame < totalFrames) {
    if (token !== waveToken) return null;
    const n = Math.min(chunkFrames, totalFrames - frame);
    const buf = await f.slice(dataStart + frame * align, dataStart + (frame + n) * align).arrayBuffer();
    const view = bits === 16 ? new Int16Array(buf)
               : format === 3 ? new Float32Array(buf)
               : bits === 32 ? new Int32Array(buf)
               : new Uint8Array(buf);
    for (let s = 0; s < n; s += fpp) {
      const e = Math.min(n, s + fpp);
      let m = 0;
      if (bits === 24) {
        for (let i = s * align, end = e * align; i < end; i += 3) {
          let v = view[i] | (view[i + 1] << 8) | (view[i + 2] << 16);
          if (v & 0x800000) v |= ~0xFFFFFF;
          if (v < 0) v = -v;
          if (v > m) m = v;
        }
      } else {
        for (let i = s * ch, end = e * ch; i < end; i++) {
          const v = view[i], a = v < 0 ? -v : v;
          if (a > m) m = a;
        }
      }
      out[pi++] = Math.min(255, Math.round(m * scale * 255));
    }
    frame += n;
    setStatus(`Building waveform… ${Math.round(frame / totalFrames * 100)}%`);
    await tick();
  }
  return out;
}

// MP3 / M4A / AIFF: decode in pieces at a low sample rate to keep memory down.
async function decodedPeaks(f, token) {
  const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!Offline) throw new Error("no audio decoder");
  const ctx = new Offline(1, 1, 22050);
  const out = [];
  const pushPeaks = buf => {
    const fpp = Math.max(1, Math.round(buf.sampleRate / 50));
    const chans = [];
    for (let c = 0; c < buf.numberOfChannels; c++) chans.push(buf.getChannelData(c));
    for (let s = 0; s < buf.length; s += fpp) {
      const e = Math.min(buf.length, s + fpp);
      let m = 0;
      for (const c of chans) for (let i = s; i < e; i++) { const a = c[i] < 0 ? -c[i] : c[i]; if (a > m) m = a; }
      out.push(Math.min(255, Math.round(m * 255)));
    }
  };

  const CHUNK = 4 * 1024 * 1024;
  let chunked = true;
  for (let start = 0; start < f.size; start += CHUNK) {
    if (token !== waveToken) return null;
    try {
      const ab = await f.slice(start, Math.min(f.size, start + CHUNK)).arrayBuffer();
      pushPeaks(await ctx.decodeAudioData(ab));
    } catch (e) {
      if (start === 0) { chunked = false; break; }    // format can't be decoded in pieces (e.g. M4A)
    }
    setStatus(`Building waveform… ${Math.round(Math.min(1, (start + CHUNK) / f.size) * 100)}%`);
    await tick();
  }

  if (!chunked) {
    if (f.size > 60 * 1024 * 1024) throw new Error("file too large to decode on the phone; WAV works best");
    out.length = 0;
    pushPeaks(await ctx.decodeAudioData(await f.arrayBuffer()));
  }
  return Uint8Array.from(out);
}

function u8ToB64(u8) {
  let s = "";
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToU8(b64) {
  const s = atob(b64), u8 = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
  return u8;
}

// ---------- Waveform: draw ----------
const cv = $("wave"), cx = cv.getContext("2d");
function resize() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  cx.setTransform(d, 0, 0, d, 0, 0);
  dirty = true;
}
window.addEventListener("resize", resize);

const viewTime = () => (scrub ? scrub.time : audio.currentTime || 0);

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  cx.clearRect(0, 0, w, h);
  const dur = duration();
  const t = viewTime();
  $("waveTime").textContent = fmt(t, true);
  $("waveZoom").textContent = Math.round(windowSec) + "s view";
  if (!file || !dur) return;

  const start = t - windowSec / 2, spp = windowSec / w, mid = h / 2;

  const x0 = Math.max(0, -start / spp), x1 = Math.min(w, (dur - start) / spp);
  if (x1 > x0) { cx.fillStyle = "rgba(255,255,255,.05)"; cx.fillRect(x0, 0, x1 - x0, h); }

  if (peaks && peaks.length) {
    const pps = peaks.length / dur;
    cx.fillStyle = "rgba(80,210,230,.9)";
    for (let x = 0; x < w; x += 2) {
      const t0 = start + x * spp, t1 = t0 + 2 * spp;
      if (t1 <= 0 || t0 >= dur) continue;
      const i0 = Math.max(0, Math.floor(t0 * pps));
      const i1 = Math.min(peaks.length, Math.max(i0 + 1, Math.floor(t1 * pps)));
      let m = 0;
      for (let i = i0; i < i1; i++) if (peaks[i] > m) m = peaks[i];
      const a = (m / 255) * h * 0.42;
      cx.fillRect(x, mid - a, 1.5, Math.max(1, a * 2));
    }
  }

  cx.fillStyle = "#ff3b30";
  for (const m of marks) if (m >= start && m <= start + windowSec) cx.fillRect((m - start) / spp - 1, 0, 2, h);

  cx.fillStyle = "#fff";
  cx.fillRect(w / 2 - 1, 0, 2, h);   // playhead
}

function loop() {
  if (dirty || !audio.paused || scrub) { draw(); updateTime(); dirty = false; }
  requestAnimationFrame(loop);
}

// ---------- Waveform: drag to scrub, pinch to zoom ----------
const wb = $("waveBox");
const dist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);

function endScrub(apply) {
  if (!scrub) return;
  const s = scrub; scrub = null;
  if (apply) seek(s.time);
  if (s.wasPlaying) play();
  dirty = true;
}

wb.addEventListener("touchstart", e => {
  e.preventDefault();
  if (!file || !duration()) return;
  if (e.touches.length >= 2) {
    endScrub(false);
    pinch = { d: dist(e.touches), base: windowSec };
  } else if (!pinch) {
    const wasPlaying = !audio.paused;
    if (wasPlaying) audio.pause();
    scrub = { x: e.touches[0].clientX, start: audio.currentTime, time: audio.currentTime, wasPlaying };
  }
}, { passive: false });

wb.addEventListener("touchmove", e => {
  e.preventDefault();
  if (pinch && e.touches.length >= 2) {
    windowSec = clamp(pinch.base * pinch.d / Math.max(1, dist(e.touches)), 5, 600);
    dirty = true;
  } else if (scrub) {
    const dx = e.touches[0].clientX - scrub.x;
    scrub.time = clamp(scrub.start - dx * windowSec / wb.clientWidth, 0, duration());
    dirty = true;
  }
}, { passive: false });

const touchEnd = e => {
  if (e.touches.length === 0) { endScrub(true); pinch = null; }
};
wb.addEventListener("touchend", touchEnd);
wb.addEventListener("touchcancel", touchEnd);

// ---------- Export ----------
// Standard MIDI file, 120 BPM, 480 ticks/quarter (960 ticks/sec, ~1 ms).
// Each mark = a short C3 note + a "Mark N" marker event.
function makeMIDI(times, name) {
  const TPQ = 480, TPS = 960, NOTE = 120;
  const vlq = v => { v = Math.max(0, Math.floor(v)); const b = [v & 0x7f]; v = Math.floor(v / 128); while (v > 0) { b.unshift((v & 0x7f) | 0x80); v = Math.floor(v / 128); } return b; };
  const enc = s => Array.from(new TextEncoder().encode(s));
  const meta = (type, p) => [0xFF, type, ...vlq(p.length), ...p];
  const ev = []; let seq = 0;
  const add = (tick, order, data) => ev.push({ tick, order, seq: seq++, data });

  add(0, 0, meta(0x03, enc(name)));
  add(0, 0, meta(0x51, [0x07, 0xA1, 0x20]));   // 500000 µs/quarter = 120 BPM
  add(0, 0, meta(0x58, [4, 2, 24, 8]));        // 4/4

  const ticks = [...new Set(times.map(t => Math.round(Math.max(0, t) * TPS)))].sort((a, b) => a - b);
  ticks.forEach((t, i) => {
    const next = i + 1 < ticks.length ? ticks[i + 1] : Infinity;
    const len = Math.max(1, Math.min(NOTE, next - t));
    add(t, 1, meta(0x06, enc("Mark " + (i + 1))));
    add(t, 2, [0x90, 60, 100]);
    add(t + len, 0, [0x80, 60, 0]);
  });
  ev.sort((a, b) => a.tick - b.tick || a.order - b.order || a.seq - b.seq);

  const trk = []; let last = 0;
  for (const e of ev) { trk.push(...vlq(e.tick - last), ...e.data); last = e.tick; }
  trk.push(0x00, 0xFF, 0x2F, 0x00);

  const be32 = v => [(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255];
  const be16 = v => [(v >> 8) & 255, v & 255];
  return new Uint8Array([...enc("MThd"), ...be32(6), ...be16(0), ...be16(1), ...be16(TPQ),
                         ...enc("MTrk"), ...be32(trk.length), ...trk]);
}

function makeCSV(times) {
  let s = "Mark,Timecode,Seconds\n";
  times.forEach((t, i) => { s += `${i + 1},${fmt(t, true)},${t.toFixed(3)}\n`; });
  return new TextEncoder().encode(s);
}

async function shareFile(data, name, type) {
  const f = new File([data], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f] }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(f); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// ---------- Menu ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderMenu() {
  const m = $("menu");
  let html = `<h1>Edit Marker</h1>`;

  if (file) {
    html += `<div class="label">Current file</div><div class="card">
      <div class="row"><span class="strong">${esc(file.name)}</span></div>
      <button class="row" data-act="back">▶︎ Back to player</button>
      <button class="row" data-act="midi">Export marks as MIDI</button>
      <button class="row" data-act="csv">Export marks as text (CSV)</button>
    </div><div class="foot"></div>`;

    html += `<div class="label">Marks (${marks.length})</div><div class="card">`;
    if (!marks.length) html += `<div class="row empty">No marks yet</div>`;
    marks.forEach((t, i) => {
      html += `<div class="row markrow" data-jump="${i}"><span>Mark ${i + 1}</span>
        <span style="display:flex;align-items:center;gap:4px"><span class="mono">${fmt(t, true)}</span>
        <button class="del" data-del="${i}" aria-label="Delete">✕</button></span></div>`;
    });
    if (marks.length) html += `<button class="row danger" data-act="clear">Clear all marks</button>`;
    html += `</div><div class="foot">Tap a mark to jump there.</div>`;
  }

  html += `<div class="label">Files</div><div class="card">
      <button class="row" data-act="open">${file ? "Open a different file…" : "Open audio file…"}</button>
    </div><div class="foot">Marks are saved per file. Open the same file again later and they come back.</div>`;

  html += `<div class="label">Settings</div><div class="card">
      <div class="row"><span>Reaction offset: <b>${offset.toFixed(2)} s</b></span>
        <span class="stepper"><button data-act="off-">−</button><button data-act="off+">+</button></span></div>
    </div><div class="foot">Each mark is placed this far before the moment you pressed.<br>
    AirPods: 1 press = mark · 2 = play/pause · 3 = back 15 s.</div>`;

  m.innerHTML = html;
}

$("menu").addEventListener("click", async e => {
  const del = e.target.closest("[data-del]");
  if (del) { e.stopPropagation(); marks.splice(+del.dataset.del, 1); saveMarks(); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump) { seek(marks[+jump.dataset.jump]); closeMenu(); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const base = file ? file.name.replace(/\.[^.]+$/, "") : "marks";
  switch (act.dataset.act) {
    case "back": closeMenu(); break;
    case "open": $("fileInput").click(); break;
    case "midi": await shareFile(makeMIDI(marks, base + " marks"), base + "_marks.mid", "audio/midi"); break;
    case "csv":  await shareFile(makeCSV(marks), base + "_marks.csv", "text/csv"); break;
    case "clear": if (confirm("Delete all marks for this file?")) { marks = []; lastMark = null; saveMarks(); } break;
    case "off-": offset = Math.max(0, +(offset - 0.25).toFixed(2)); store("em.offset", offset); renderMenu(); break;
    case "off+": offset = Math.min(5, +(offset + 0.25).toFixed(2)); store("em.offset", offset); renderMenu(); break;
  }
});

function openMenu() { renderMenu(); $("menu").classList.add("open"); }
function closeMenu() { if (!file) return; $("menu").classList.remove("open"); requestAnimationFrame(resize); }
$("menuBtn").addEventListener("click", openMenu);

// ---------- Start ----------
renderMenu();
updateUI();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
